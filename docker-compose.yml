services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./db/backup.sh:/backup.sh
      - ./db/restore.sh:/restore.sh
      - ./db/load_seed.sh:/load_seed.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: ${PORT:-3001}
      JWT_SECRET: ${JWT_SECRET}
      # Während einer JWT-Secret-Rotation zusätzlich das alte Secret setzen,
      # damit noch gültige Alt-Tokens akzeptiert werden (siehe README "Secrets rotieren").
      JWT_SECRET_OLD: ${JWT_SECRET_OLD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-15552000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      BESTELLUNG_ENCRYPTION_KEY: ${BESTELLUNG_ENCRYPTION_KEY}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-unversioniert}
      BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG: ${BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG:-90}
      BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG: ${BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG:-10}

      # E-Rechnung: Stammdaten des Rechnungsstellers (siehe .env.example / docs/E-RECHNUNG.md)
      VERKAEUFER_STEUERNUMMER: ${VERKAEUFER_STEUERNUMMER:-}
      VERKAEUFER_USTIDNR: ${VERKAEUFER_USTIDNR:-}
      VERKAEUFER_FIRMA: ${VERKAEUFER_FIRMA:-}
      VERKAEUFER_NAME: ${VERKAEUFER_NAME:-}
      VERKAEUFER_STRASSE: ${VERKAEUFER_STRASSE:-}
      VERKAEUFER_PLZ: ${VERKAEUFER_PLZ:-}
      VERKAEUFER_ORT: ${VERKAEUFER_ORT:-}
      VERKAEUFER_LAND: ${VERKAEUFER_LAND:-}
      VERKAEUFER_TELEFON: ${VERKAEUFER_TELEFON:-}
      VERKAEUFER_EMAIL: ${VERKAEUFER_EMAIL:-}
      VERKAEUFER_WEBSITE: ${VERKAEUFER_WEBSITE:-}
      VERKAEUFER_BANK: ${VERKAEUFER_BANK:-}
      VERKAEUFER_IBAN: ${VERKAEUFER_IBAN:-}
      VERKAEUFER_BIC: ${VERKAEUFER_BIC:-}
    ports:
      - "3000:${PORT:-3001}"
    # Ohne eigenen Healthcheck sah ein Backend mit gescheiterter Migration für
    # Docker gesund aus (Befund A3/E5). /api/health antwortet erst mit 200,
    # wenn das Schema vollständig verifiziert ist.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:'+(process.env.PORT||3001)+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

# ── Datei-basierte Secrets statt Klartext in .env (Issue #140) ──────────────
# `external: true`-Secrets funktionieren nur im Swarm-Modus; für ein einzelnes
# `docker compose up` auf z.B. einer Synology sind dateibasierte Secrets der
# realistische Weg – Compose mountet sie auch ohne Swarm nach /run/secrets/.
# Zum Aktivieren: Dateien unter ./secrets/ anlegen (siehe .gitignore – niemals
# committen), unten einkommentieren, und in der `app`-Umgebung oben
# DATABASE_URL/JWT_SECRET/BESTELLUNG_ENCRYPTION_KEY durch die *_FILE-Variante
# ersetzen (z.B. JWT_SECRET_FILE: /run/secrets/jwt_secret), siehe
# backend/src/config/secrets.js. Details: README.md "Secrets rotieren".
#
# secrets:
#   jwt_secret:
#     file: ./secrets/jwt_secret.txt
#   db_password:
#     file: ./secrets/db_password.txt
#   bestellung_encryption_key:
#     file: ./secrets/bestellung_encryption_key.txt
#
# app:
#   secrets: [jwt_secret, db_password, bestellung_encryption_key]
# db:
#   secrets: [db_password]
#   environment:
#     POSTGRES_PASSWORD_FILE: /run/secrets/db_password  # vom offiziellen postgres-Image nativ unterstützt

volumes:
  pgdata:
  pgbackups:
