services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Ersetzen Sie /volume1 mit Ihrem tatsächlichen Volume auf Synology
      - /volume1/docker/goldregendb/data:/var/lib/postgresql/data
      - /volume1/docker/goldregendb/backups:/backups
      - /volume1/docker/goldregendb/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - /volume1/docker/goldregendb/db/backup.sh:/backup.sh
      - /volume1/docker/goldregendb/db/restore.sh:/restore.sh
      - /volume1/docker/goldregendb/db/load_seed.sh:/load_seed.sh
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m
    networks:
      - goldregendb_net

  app:
    # Vorgefertigtes Image aus GitHub Container Registry – kein lokaler Build nötig.
    # Kompatibel mit Synology Container Manager (DSM). VITE_API_URL=/api ist bereits
    # im Image eingebettet; Express liefert Frontend und API same-origin aus.
    image: ghcr.io/revilo91/goldregendb:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      # Während einer JWT-Secret-Rotation zusätzlich das alte Secret setzen,
      # damit noch gültige Alt-Tokens akzeptiert werden (siehe README "Secrets rotieren").
      JWT_SECRET_OLD: ${JWT_SECRET_OLD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-15552000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      BESTELLUNG_ENCRYPTION_KEY: ${BESTELLUNG_ENCRYPTION_KEY}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION}
      BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG: ${BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG}
      BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG: ${BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG}
    volumes:
      # Hochgeladene Fotos dauerhaft speichern
      - /volume1/docker/goldregendb/uploads:/app/src/assets/uploads
    ports:
      - "3000:${PORT}"
    networks:
      - goldregendb_net

networks:
  goldregendb_net:
    driver: bridge

# Keine named volumes nötig bei absoluten Pfaden

# ── Datei-basierte Secrets statt Klartext in .env (Issue #140) ──────────────
# Auf DSM läuft nur `docker compose up`, kein Swarm – `external: true`-Secrets
# funktionieren dort nicht, dateibasierte Secrets (`file: ...`) dagegen schon:
# Compose mountet sie auch ohne Swarm nach /run/secrets/. Empfohlen für die
# Synology, da die .env sonst dauerhaft im Klartext auf dem NAS-Volume liegt.
# Aktivieren: Dateien unter /volume1/docker/goldregendb/secrets/ anlegen
# (0600, nur root), unten einkommentieren, und oben in der `app`-Umgebung
# DATABASE_URL/JWT_SECRET/BESTELLUNG_ENCRYPTION_KEY durch die *_FILE-Variante
# ersetzen. Details: README.md "Secrets rotieren".
#
# secrets:
#   jwt_secret:
#     file: /volume1/docker/goldregendb/secrets/jwt_secret.txt
#   db_password:
#     file: /volume1/docker/goldregendb/secrets/db_password.txt
#   bestellung_encryption_key:
#     file: /volume1/docker/goldregendb/secrets/bestellung_encryption_key.txt
#
# app:
#   secrets: [jwt_secret, db_password, bestellung_encryption_key]
# db:
#   secrets: [db_password]
#   environment:
#     POSTGRES_PASSWORD_FILE: /run/secrets/db_password  # vom offiziellen postgres-Image nativ unterstützt
