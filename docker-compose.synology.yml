services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Ersetzen Sie /volume1 mit Ihrem tatsächlichen Volume auf Synology
      - /volume1/docker/goldregendb/data:/var/lib/postgresql/data
      - /volume1/docker/goldregendb/backups:/backups
      - /volume1/docker/goldregendb/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - /volume1/docker/goldregendb/db/backup.sh:/backup.sh
      - /volume1/docker/goldregendb/db/restore.sh:/restore.sh
      - /volume1/docker/goldregendb/db/load_seed.sh:/load_seed.sh
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m
    networks:
      - goldregendb_net

  app:
    # Vorgefertigtes Image aus GitHub Container Registry – kein lokaler Build nötig.
    # Kompatibel mit Synology Container Manager (DSM). VITE_API_URL=/api ist bereits
    # im Image eingebettet; Express liefert Frontend und API same-origin aus.
    image: ghcr.io/revilo91/goldregendb:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      BESTELLUNG_ENCRYPTION_KEY: ${BESTELLUNG_ENCRYPTION_KEY}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION}
      BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG: ${BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG}
      BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG: ${BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG}
    volumes:
      # Hochgeladene Fotos dauerhaft speichern
      - /volume1/docker/goldregendb/uploads:/app/src/assets/uploads
    ports:
      - "3000:${PORT}"
    networks:
      - goldregendb_net

networks:
  goldregendb_net:
    driver: bridge

# Keine named volumes nötig bei absoluten Pfaden
