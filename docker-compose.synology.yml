services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Ersetzen Sie /volume1 mit Ihrem tatsächlichen Volume auf Synology
      - /volume1/docker/goldregendb/data:/var/lib/postgresql/data
      - /volume1/docker/goldregendb/backups:/backups
      - /volume1/docker/goldregendb/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - /volume1/docker/goldregendb/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - /volume1/docker/goldregendb/db/backup.sh:/backup.sh
      - /volume1/docker/goldregendb/db/restore.sh:/restore.sh
      - /volume1/docker/goldregendb/db/load_seed.sh:/load_seed.sh
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m
    networks:
      - goldregendb_net

  backend:
    build:
      context: /volume1/docker/goldregendb/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${PORT}:${PORT}"
    networks:
      - goldregendb_net

  frontend:
    build:
      context: /volume1/docker/goldregendb/frontend
      dockerfile: Dockerfile
      args:
        # Build-Zeit-Argument: Wird beim Build in die React-App eingebettet.
        # Relative URL: API-Anfragen laufen über den nginx-Proxy im Frontend-Container.
        # Dadurch funktioniert die Verbindung unabhängig von der IP-Adresse der Synology.
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - goldregendb_net

networks:
  goldregendb_net:
    driver: bridge

# Keine named volumes nötig bei absoluten Pfaden
