services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # DATA_DIR in der .env setzen, wenn die Daten nicht auf /volume1 liegen sollen.
      - ${DATA_DIR:-/volume1/docker/goldregendb}/data:/var/lib/postgresql/data
      - ${DATA_DIR:-/volume1/docker/goldregendb}/backups:/backups
      # Relativ zu dieser Datei: liegen im Release-ZIP neben docker-compose.yml.
      # seed.sql bewusst nicht – init.sql legt nur das Schema und den Admin an.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/backup.sh:/backup.sh:ro
      - ./db/restore.sh:/restore.sh:ro
    ports:
      - "${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m
    networks:
      - goldregendb_net

  app:
    # Vorgefertigtes Image aus GitHub Container Registry – kein lokaler Build nötig.
    # Kompatibel mit Synology Container Manager (DSM). VITE_API_URL=/api ist bereits
    # im Image eingebettet; Express liefert Frontend und API same-origin aus.
    # IMAGE_TAG trägt das Release-Paket in seine .env.example ein.
    image: ghcr.io/revilo91/goldregendb:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      # Während einer JWT-Secret-Rotation zusätzlich das alte Secret setzen,
      # damit noch gültige Alt-Tokens akzeptiert werden (siehe README "Secrets rotieren").
      JWT_SECRET_OLD: ${JWT_SECRET_OLD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-15552000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      BESTELLUNG_ENCRYPTION_KEY: ${BESTELLUNG_ENCRYPTION_KEY}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION}
      BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG: ${BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG}
      BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG: ${BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG}
      # E-Rechnung: Stammdaten des Rechnungsstellers (siehe .env.example / docs/E-RECHNUNG.md)
      VERKAEUFER_STEUERNUMMER: ${VERKAEUFER_STEUERNUMMER:-}
      VERKAEUFER_USTIDNR: ${VERKAEUFER_USTIDNR:-}
      VERKAEUFER_FIRMA: ${VERKAEUFER_FIRMA:-}
      VERKAEUFER_NAME: ${VERKAEUFER_NAME:-}
      VERKAEUFER_STRASSE: ${VERKAEUFER_STRASSE:-}
      VERKAEUFER_PLZ: ${VERKAEUFER_PLZ:-}
      VERKAEUFER_ORT: ${VERKAEUFER_ORT:-}
      VERKAEUFER_LAND: ${VERKAEUFER_LAND:-}
      VERKAEUFER_TELEFON: ${VERKAEUFER_TELEFON:-}
      VERKAEUFER_EMAIL: ${VERKAEUFER_EMAIL:-}
      VERKAEUFER_WEBSITE: ${VERKAEUFER_WEBSITE:-}
      VERKAEUFER_BANK: ${VERKAEUFER_BANK:-}
      VERKAEUFER_IBAN: ${VERKAEUFER_IBAN:-}
      VERKAEUFER_BIC: ${VERKAEUFER_BIC:-}
    volumes:
      # Hochgeladene Fotos dauerhaft speichern
      - ${DATA_DIR:-/volume1/docker/goldregendb}/uploads:/app/src/assets/uploads
    ports:
      - "${APP_HOST_PORT:-3000}:${PORT}"
    networks:
      - goldregendb_net

networks:
  goldregendb_net:
    driver: bridge

# ── Datei-basierte Secrets statt Klartext in .env (Issue #140) ──────────────
# Auf DSM läuft nur `docker compose up`, kein Swarm – `external: true`-Secrets
# funktionieren dort nicht, dateibasierte Secrets (`file: ...`) dagegen schon:
# Compose mountet sie auch ohne Swarm nach /run/secrets/. Empfohlen für die
# Synology, da die .env sonst dauerhaft im Klartext auf dem NAS-Volume liegt.
# Aktivieren: Dateien unter ${DATA_DIR}/secrets/ anlegen
# (0600, nur root), unten einkommentieren, und oben in der `app`-Umgebung
# DATABASE_URL/JWT_SECRET/BESTELLUNG_ENCRYPTION_KEY durch die *_FILE-Variante
# ersetzen. Details: README.md "Secrets rotieren".
#
# secrets:
#   jwt_secret:
#     file: ${DATA_DIR:-/volume1/docker/goldregendb}/secrets/jwt_secret.txt
#   db_password:
#     file: ${DATA_DIR:-/volume1/docker/goldregendb}/secrets/db_password.txt
#   bestellung_encryption_key:
#     file: ${DATA_DIR:-/volume1/docker/goldregendb}/secrets/bestellung_encryption_key.txt
#
# app:
#   secrets: [jwt_secret, db_password, bestellung_encryption_key]
# db:
#   secrets: [db_password]
#   environment:
#     POSTGRES_PASSWORD_FILE: /run/secrets/db_password  # vom offiziellen postgres-Image nativ unterstützt
