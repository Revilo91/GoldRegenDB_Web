name: Release für Synology

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Docker Images bauen und veröffentlichen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Tags aus metadata-action tragen kein führendes "v" (v1.2.3 -> 1.2.3).
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Metadaten für Image ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/goldregendb
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            APP_VERSION=${{ github.ref_name }}

  create-release:
    name: GitHub Release erstellen
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Synology-Deployment-Paket erstellen
        run: scripts/build-release-package.sh "$GITHUB_REF_NAME" .

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: GoldRegenDB ${{ github.ref_name }}
          body: |
            ## GoldRegenDB ${{ github.ref_name }}

            ### Docker Image
            Das fertige Image ist im GitHub Container Registry verfügbar:
            - **Image:** `${{ needs.build-and-push.outputs.image }}`

            ### Synology Deployment
            Das Deployment-Paket (`goldregendb-synology-*.zip`) enthält alle benötigten Dateien.
            Siehe `README.md` im Paket für die Installationsanleitung.
          files: goldregendb-synology-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
