services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - pgbackups_dev:/backups
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./db/backup.sh:/backup.sh
      - ./db/restore.sh:/restore.sh
      - ./db/load_seed.sh:/load_seed.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: development
      PORT: ${PORT}
      VITE_API_URL: ${VITE_API_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_OLD: ${JWT_SECRET_OLD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BESTELLUNG_ENCRYPTION_KEY: ${BESTELLUNG_ENCRYPTION_KEY}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION}
      BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG: ${BESTELLUNG_RETENTION_TAGE_OHNE_RECHNUNG}
      BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG: ${BESTELLUNG_RETENTION_JAHRE_MIT_RECHNUNG}
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/scripts:/app/backend/scripts
      - ./backend/package.json:/app/backend/package.json
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - app_node_modules:/app/node_modules
    ports:
      - "3000:5173"
      - "3001:${PORT}"
    healthcheck:
      # -f ist hier wesentlich: ohne das Flag liefert curl auch bei HTTP 503
      # Exit 0, und /api/health antwortet mit 503, solange die Schema-Migration
      # läuft oder gescheitert ist (Befund A3).
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata_dev:
  pgbackups_dev:
  app_node_modules:
